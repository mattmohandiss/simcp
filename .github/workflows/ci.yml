name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  platform-check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: macOS x64
            runner: macos-15-intel
          - name: macOS ARM64
            runner: macos-14
          - name: Windows x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: native/snapshot/go.mod
      - uses: astral-sh/setup-uv@v10.3.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: uvx ruff check worker
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run tests/process.test.ts
      - run: go test ./...
        working-directory: native/snapshot
      - uses: cachix/install-nix-action@v31
        if: matrix.name == 'Linux x64'
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix develop -c just integration
        if: matrix.name == 'Linux x64'
